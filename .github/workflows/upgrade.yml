name: GKI Pure Subversion Upgrade (Android 16 Fix)
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev crossbuild-essential-arm64 git libelf-dev curl python3

      - name: Initialize and Sync Official AOSP Kernel Source
        run: |
          git config --global user.name "GitHub-Actions"
          git config --global user.email "actions@github.com"
          mkdir -p bin
          curl -s "https://googlesource.com" | base64 -d > bin/repo
          chmod a+x bin/repo
          ./bin/repo init --depth=1 --no-repo-verify --repo-url=https://googlesource.com -u https://googlesource.com -b common-android15-6.6-lts
          ./bin/repo sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: Compile via Bazel using Defconfig Fragments
        run: |
          export REPO_URL="https://android.googlesource.com"
          export GLOBS_URL="https://android.googlesource.com"
          tools/bazel --output_user_root=$GITHUB_WORKSPACE/bazel_root run //common:kernel_aarch64_dist -- --kconfig_add=CONFIG_MODVERSIONS=y --kconfig_add=CONFIG_MODULE_FORCE_LOAD=y

      - name: Upload Finished GKI Image
        uses: actions/upload-artifact@v4
        with:
          name: Clean-GKI-Image
          path: out/android15-6.6/dist/Image.gz
