name: GKI Pure Subversion Upgrade (Android 16 Fix)
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Free Up Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'

      - name: Run GKI Safe Kernel Builder Action
        uses: xiaoleGun/KernelSU_Action@main
        with:
          kernel-url: https://googlesource.com
          kernel-branch: android15-6.6
          config: gki_defconfig
          arch: arm64
          android-version: 16
          ksu-version: main
          enable-ksu: false
