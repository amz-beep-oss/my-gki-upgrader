name: GKI Pure Subversion Upgrade (Android 16 Fix)
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Install System Utilities
        run: |
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev crossbuild-essential-arm64 git libelf-dev curl python3 lz4 zstd ccache

      - name: Setup Direct Workspace Folders
        run: |
          mkdir -p workspace/tools

      - name: Clone GKI Kernel Core via Official Checkout
        uses: actions/checkout@v4
        with:
          repository: aosp-mirror-neo/kernel_common
          ref: android15-6.6-lts
          path: workspace/common
          fetch-depth: 0

      - name: Clone Google Kleaf Bazel Tools via Official Checkout
        uses: actions/checkout@v4
        with:
          repository: aosp-mirror-neo/kernel_build
          ref: main
          path: workspace/build/kernel 
          fetch-depth: 1

      - name: Prepare Clean Execution Tools (Fix Workspace Root)
        run: |
          cd workspace
          ln -sf ../build/kernel/kleaf/bazel.sh tools/bazel
          ln -sf build/kernel/kleaf/bazel.WORKSPACE WORKSPACE.bazel
          ln -sf build/kernel/kleaf/bazel.BUILD BUILD.bazel
          
          if [ -f build/kernel/kleaf/bzlmod/bazel.MODULE.bazel ]; then
            ln -sf build/kernel/kleaf/bzlmod/bazel.MODULE.bazel MODULE.bazel
          elif [ -f build/kernel/kleaf/bazel.MODULE.bazel ]; then
            ln -sf build/kernel/kleaf/bazel.MODULE.bazel MODULE.bazel
          fi
          
          touch WORKSPACE

      - name: Mock Google Prebuilt Toolchains and Python Paths
        run: |
          cd workspace
          
          # Root level prebuilts mock for Python
          mkdir -p prebuilts/build-tools/linux_musl-x86/bin/
          ln -sf /usr/bin/python3 prebuilts/build-tools/linux_musl-x86/bin/py3-cmd
          mkdir -p prebuilts/build-tools/path/linux-x86/bin/
          ln -sf /usr/bin/python3 prebuilts/build-tools/path/linux-x86/bin/py3-cmd

          # Kleaf relative path mock for Python
          mkdir -p build/kernel/kleaf/prebuilts/build-tools/linux_musl-x86/bin/
          ln -sf /usr/bin/python3 build/kernel/kleaf/prebuilts/build-tools/linux_musl-x86/bin/py3-cmd
          mkdir -p build/kernel/kleaf/prebuilts/build-tools/path/linux-x86/bin/
          ln -sf /usr/bin/python3 build/kernel/kleaf/prebuilts/build-tools/path/linux-x86/bin/py3-cmd

          # Provide Bazel 8.1.0 binary expected by Kleaf wrapper
          mkdir -p prebuilts/kernel-build-tools/bazel/linux-x86_64/
          curl -L https://github.com/bazelbuild/bazel/releases/download/8.1.0/bazel-8.1.0-linux-x86_64 -o prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel
          chmod +x prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel

      - name: Merge Latest AOSP 6.6 Source & Inject Config Options
        run: |
          cd workspace/common
          
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          git remote add aosp https://android.googlesource.com/kernel/common
          git fetch aosp android15-6.6 --depth=100
          
          git merge FETCH_HEAD --no-edit -X theirs || git merge --abort
          
          echo "-android15-8-g8e4be6b47e40-ab14134548-4k" > localversion-gki

          # Natively inject module configuration choices into the base defconfig
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          if [ -f "$CONFIG_FILE" ]; then
            echo "CONFIG_MODVERSIONS=y" >> "$CONFIG_FILE"
            echo "CONFIG_MODULE_FORCE_LOAD=y" >> "$CONFIG_FILE"
          fi

      - name: Compile via Official Google Bazel Engine
        run: |
          cd workspace
          export REPO_URL="https://googlesource.com"
          export GLOBS_URL="https://googlesource.com"
          
          ./tools/bazel --output_user_root=$GITHUB_WORKSPACE/bazel_root run \
            --spawn_strategy=local \
            //common:kernel_aarch64_dist

      - name: Upload Finished GKI Image
        uses: actions/upload-artifact@v4
        with:
          name: Clean-GKI-Image
          path: workspace/out/android15-6.6/dist/Image.gz
