name: GKI Pure Subversion Upgrade (Android 16 Fix)
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev crossbuild-essential-arm64 git libelf-dev curl

      - name: Initialize and Sync Official AOSP Kernel Source
        run: |
          git config --global user.name "GitHub-Actions"
          git config --global user.email "actions@github.com"
          mkdir -p bin
          curl https://googleapis.com > bin/repo
          chmod a+x bin/repo
          mkdir android-kernel
          cd android-kernel
          ../bin/repo init --depth=1 --no-repo-verify --repo-url=https://gerrit.googlesource.com/git-repo -u https://googlesource.com -b common-android15-6.6-lts
          ../bin/repo sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: Hack Kernel Config & Compile via Bazel
        run: |
          cd android-kernel/common
          echo "CONFIG_MODVERSIONS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MODULE_FORCE_LOAD=y" >> arch/arm64/configs/gki_defconfig
          cd ..
          export REPO_URL="https://android.googlesource.com"
          export GLOBS_URL="https://android.googlesource.com"
          tools/bazel --output_user_root=$GITHUB_WORKSPACE/bazel_root run //common:kernel_aarch64_dist

      - name: Upload Finished GKI Image
        uses: actions/upload-artifact@v4
        with:
          name: Clean-GKI-Image
          path: android-kernel/out/android15-6.6/dist/Image.gz
