name: GKI Pure Subversion Upgrade (Android 16 Fix)
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Install System Dependencies & Clang
        run: |
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev crossbuild-essential-arm64 git libelf-dev curl python3 clang llvm lld

      - name: Clone Kernel Common Source via Official Checkout
        uses: actions/checkout@v4
        with:
          repository: aosp-mirror-neo/kernel_common
          ref: android15-6.6-lts
          path: common
          fetch-depth: 1

      - name: Compile Custom GKI Kernel
        run: |
          cd common
          echo "CONFIG_MODVERSIONS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MODULE_FORCE_LOAD=y" >> arch/arm64/configs/gki_defconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang HOSTCC=clang LINKER=ld.lld gki_defconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang HOSTCC=clang LINKER=ld.lld -j$(nproc)

      - name: Upload Finished GKI Image
        uses: actions/upload-artifact@v4
        with:
          name: Clean-GKI-Image
          path: common/out/arch/arm64/boot/Image.gz
